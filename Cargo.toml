[package]
name = "blerust"
version = "0.1.3"
edition = "2024"
description = "Blazing fast and robust line editor in Rust (replacement for blesh)"
license = "MIT"
repository = "https://github.com/SisyphusAeolides/blerust"

[dependencies]
crossterm = "0.29.0"
fuzzy-matcher = "0.3.7"
libc = "0.2.189"
unicode-width = "0.2.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
